name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Demo script lint
        run: make demo-scripts-lint

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_harbor
          POSTGRES_PASSWORD: agent_harbor
          POSTGRES_DB: agent_harbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_harbor -d agent_harbor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HARBOR_TEST_DATABASE_URL: postgres://agent_harbor:agent_harbor@127.0.0.1:5432/agent_harbor?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Store integration tests
        run: make test-postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test
        run: make frontend-test

      - name: Build
        run: make frontend-build
