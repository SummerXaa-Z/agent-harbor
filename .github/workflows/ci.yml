name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go format check
        run: make gofmt-check

      - name: Test
        run: make test

      - name: Race detector
        run: make test-race

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Scenario script lint
        run: make scenario-scripts-lint

      - name: Production hardening gate
        run: make production-hardening

      - name: GitHub config lint
        run: make github-config-lint

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scan dependencies
        run: make dependency-audit

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_harbor
          POSTGRES_PASSWORD: agent_harbor
          POSTGRES_DB: agent_harbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_harbor -d agent_harbor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HARBOR_TEST_DATABASE_URL: postgres://agent_harbor:agent_harbor@127.0.0.1:5432/agent_harbor?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Store integration tests with race detector
        run: make test-postgres-race

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test
        run: make frontend-test

      - name: Build
        run: make frontend-build

  frontend-required:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [frontend, dependency-security]
    if: always()
    steps:
      - name: Verify frontend matrix
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend matrix completed with result: ${{ needs.frontend.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.dependency-security.result }}" != "success" ]]; then
            echo "Dependency security completed with result: ${{ needs.dependency-security.result }}" >&2
            exit 1
          fi
          echo "Frontend matrix passed"
          echo "Dependency security passed"
