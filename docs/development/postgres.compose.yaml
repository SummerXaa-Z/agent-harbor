services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_harbor
      POSTGRES_PASSWORD: agent_harbor
      POSTGRES_DB: agent_harbor
    ports:
      - "5432:5432"
    volumes:
      - agent-harbor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_harbor -d agent_harbor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-harbor-postgres:
